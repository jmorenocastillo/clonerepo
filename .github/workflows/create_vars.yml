name: Generar tfvars y subir como artefactos

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno (ej. d1, p1)'
        required: true
      location:
        description: 'Location Azure (ej. westeurope)'
        required: true

jobs:
  generate_tfvars:
    runs-on: ubuntu-latest
    env:
      REPO_NAME: ${{ github.repository }}
      ENVIRONMENT: ${{ inputs.environment || 'd1' }}
      LOCATION: ${{ inputs.location || 'westeurope' }}

    steps:
      - uses: actions/checkout@v4

      - name: Generar tfvars dinámicos
        run: python generate_tfvars.py

      - name: Subir tfvars generados como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: generated_tfvars
          path: generated_*.tfvars  # Sube todos los archivos que empiecen por "generated_"
          retention-days: 30        # Opcional: cuántos días mantener los artefactos

      # Opcional: Si quieres ver qué se generó (para debug)
      - name: Listar archivos generados
        run: ls -la generated_*.tfvars